<svg width="140" height="40" viewBox="0 0 140 40" xmlns="http://www.w3.org/2000/svg">
<defs>
  <style>
    @keyframes pulse {
      0%,100% { opacity:0.35; }
      50% { opacity:0.8; }
    }
    @keyframes sweep {
      0% { transform:translateX(-160px); opacity:0; }
      20% { opacity:0.12; }
      80% { opacity:0.12; }
      100% { transform:translateX(300px); opacity:0; }
    }
    .text {
      font-family:"Trebuchet MS",Arial,sans-serif;
      font-weight:600;
      font-size:12px;
      letter-spacing:1px;
    }
    .pulse { animation:pulse 3s ease-in-out infinite; }
    .sweep { animation:sweep 5s linear infinite; }
  </style>

  <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#071721"/>
    <stop offset="100%" stop-color="#071420"/>
  </linearGradient>

  <linearGradient id="edge" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#00b8d4"/>
    <stop offset="50%" stop-color="#00e5ff"/>
    <stop offset="100%" stop-color="#00b8d4"/>
  </linearGradient>

  <linearGradient id="sweepGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#00e5ff" stop-opacity="0"/>
    <stop offset="50%" stop-color="#ffffff" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
  </linearGradient>

  <filter id="glow" x="-30%" y="-50%" width="160%" height="200%">
    <feGaussianBlur stdDeviation="2"/>
  </filter>

  <clipPath id="clip">
    <rect x="1" y="1" width="138" height="38" rx="10"/>
  </clipPath>
</defs>

<a href="https://www.linkedin.com/in/erika-azzahra-ba238a3ab/" target="_blank">
  <rect x="1" y="1" width="138" height="38" rx="10" fill="url(#bg)"/>
  <rect x="1" y="1" width="138" height="38" rx="10" fill="none" stroke="url(#edge)" stroke-width="1.2" opacity="0.75"/>

  <g clip-path="url(#clip)">
    <rect class="sweep" x="-160" y="0" width="160" height="40" fill="url(#sweepGrad)"/>
  </g>

  <circle class="pulse" cx="17" cy="20" r="3" fill="#00e5ff" filter="url(#glow)"/>

  <rect x="10" y="13" width="14" height="14" rx="2" fill="none" stroke="#7debf4" stroke-width="1.2"/>
  <text x="12.5" y="24" font-family="Arial,sans-serif" font-size="9" font-weight="700" fill="#7debf4">in</text>

  <text x="31" y="24" class="text" fill="#b8f7ff">LINKEDIN</text>

  <path d="M119 16 L123 20 L119 24" fill="none" stroke="#00e5ff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
</a>
</svg>