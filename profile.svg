<circle cx="831" cy="602" r=".8" fill="#d1caff" class="starB"/>
</g>

<g opacity=".62">
<circle cx="156" cy="214" r="1.4" fill="#fff" filter="url(#starGlow)"/>
<circle cx="345" cy="272" r="1.2" fill="#bdeaff" filter="url(#starGlow)"/>
