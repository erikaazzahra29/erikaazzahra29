<text x="450" y="150" text-anchor="middle" class="name" fill="url(#nameGradient)" filter="url(#textGlow)">ERIKA AZZAHRA</text>

<text x="447" y="150" text-anchor="middle" class="name glitch" fill="#a78bfa" opacity="0">ERIKA AZZAHRA</text>

<text x="453" y="150" text-anchor="middle" class="name glitch" fill="#67e8f9" opacity="0" style="animation-delay:.15s">ERIKA AZZAHRA</text>

<text x="450" y="190" text-anchor="middle" class="sub" fill="url(#subGradient)" filter="url(#textGlow)">STUDENT • DEVELOPER • GRAPHIC DESIGNER</text>

<line x1="370" y1="218" x2="530" y2="218" stroke="url(#mistBlue)" stroke-width="1.8"/>

<text x="450" y="273" text-anchor="middle" class="ach" fill="#bcefff">WELCOME TO MY GITHUB PROFILE
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.08;.14;.42;.48;1" dur="10s" repeatCount="indefinite"/>
</text>

<text x="450" y="273" text-anchor="middle" class="ach" fill="#d8caff" opacity="0">COMPUTER SCIENCE STUDENT 2024
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.53;.59;.88;.94;1" dur="10s" repeatCount="indefinite"/>
</text>

<line x1="80" y1="330" x2="820" y2="330" stroke="#142332" stroke-width="1"/>

<text x="450" y="395" text-anchor="middle" class="sectionTitle" fill="#fff" filter="url(#textGlow)">ABOUT ME</text>

<rect x="375" y="415" width="150" height="1.5" rx="1" fill="url(#mistBlue)"/>

<text x="450" y="452" text-anchor="middle" class="mini">A LITTLE ABOUT ME</text>

<text x="450" y="492" text-anchor="middle" class="body">I'm a <tspan fill="#79e7ff" font-weight="600">Computer Science student</tspan> who enjoys learning</text>

<text x="450" y="520" text-anchor="middle" class="body">new things, exploring technology, and growing along the way.</text>

<text x="450" y="550" text-anchor="middle" class="body">I may still be learning, but I'm always curious to see <tspan fill="#b69aff" font-weight="600">what I can build next.</tspan></text>

<text x="450" y="595" text-anchor="middle" class="mini">CURIOUS • LEARNING • GROWING</text>

<line x1="80" y1="635" x2="820" y2="635" stroke="#142332" stroke-width="1"/>

<text x="450" y="785" text-anchor="middle" class="mini">STILL BUILDING • STILL LEARNING</text>

<text x="450" y="820" text-anchor="middle" class="mini" fill="#394a5a">ERIKA AZZAHRA</text>

<rect class="borderA" x="12" y="12" width="876" height="856" rx="16" fill="none" stroke="#765fc0" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="75 5725" filter="url(#borderGlow)">
<animate attributeName="stroke-dashoffset" from="0" to="-5800" dur="25s" repeatCount="indefinite"/>
</rect>

<rect class="borderB" x="12" y="12" width="876" height="856" rx="16" fill="none" stroke="#c8c0e8" stroke-width="1" stroke-linecap="round" stroke-dasharray="50 5750" opacity=".025">
<animate attributeName="stroke-dashoffset" from="5800" to="0" dur="31s" repeatCount="indefinite"/>
</rect>

</svg>