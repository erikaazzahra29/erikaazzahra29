<svg width="900" height="980" viewBox="0 0 900 980" xmlns="http://www.w3.org/2000/svg">
<defs>
<style>
@keyframes starTwinkle1{0%,100%{opacity:.16}50%{opacity:.8}}
@keyframes starTwinkle2{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes auroraPulse{0%,100%{opacity:.78}50%{opacity:1}}

@keyframes shootingStar1{
0%,10%{transform:translate(0,0);opacity:0}
13%{transform:translate(-8px,6px);opacity:.9}
18%{transform:translate(-55px,38px);opacity:.95}
24%{transform:translate(-115px,79px);opacity:.72}
29%,100%{transform:translate(-165px,113px);opacity:0}
}

@keyframes shootingStar2{
0%,39%{transform:translate(0,0);opacity:0}
42%{transform:translate(-7px,5px);opacity:.88}
47%{transform:translate(-48px,34px);opacity:.92}
53%{transform:translate(-105px,73px);opacity:.62}
58%,100%{transform:translate(-155px,107px);opacity:0}
}

@keyframes shootingStar3{
0%,72%{transform:translate(0,0);opacity:0}
75%{transform:translate(-6px,4px);opacity:.8}
81%{transform:translate(-45px,31px);opacity:.84}
87%{transform:translate(-100px,69px);opacity:.48}
93%,100%{transform:translate(-150px,103px);opacity:0}
}

@keyframes glitch{
0%,92%,100%{opacity:0;transform:translate(0,0)}
94%{opacity:.65;transform:translate(-3px,1px)}
96%{opacity:.65;transform:translate(3px,-1px)}
97%{opacity:0;transform:translate(0,0)}
}

@keyframes border1{
0%{stroke-dashoffset:0;opacity:.035}
50%{opacity:.1}
100%{stroke-dashoffset:-5800;opacity:.035}
}

@keyframes border2{
0%{stroke-dashoffset:5800;opacity:.02}
50%{opacity:.065}
100%{stroke-dashoffset:0;opacity:.02}
}

.name{font:700 49px "Trebuchet MS",Arial,sans-serif;letter-spacing:2px}
.sub{font:600 15px "Trebuchet MS",Arial,sans-serif;letter-spacing:3px}
.sectionTitle{font:700 29px "Trebuchet MS",Arial,sans-serif;letter-spacing:7px}
.body{font:500 15px "Trebuchet MS",Arial,sans-serif;fill:#c4ccd8}
.mini{font:10px "Courier New",monospace;letter-spacing:2.5px;fill:#657788}
.ach{font:500 14px "Courier New",monospace;letter-spacing:.2px}

.starA{animation:starTwinkle1 3.8s ease-in-out infinite;transform-origin:center}
.starB{animation:starTwinkle2 5.2s ease-in-out infinite;transform-origin:center}
.starC{animation:starTwinkle1 4.6s ease-in-out infinite;transform-origin:center}
.auroraPulse{animation:auroraPulse 10s ease-in-out infinite}
.shoot1{animation:shootingStar1 20s linear infinite}
.shoot2{animation:shootingStar2 26s linear infinite}
.shoot3{animation:shootingStar3 34s linear infinite}
.glitch{animation:glitch 5s infinite}
.borderA{animation:border1 25s linear infinite}
.borderB{animation:border2 31s linear infinite}
</style>

<radialGradient id="bg" cx="50%" cy="48%" r="82%">
<stop offset="0%" stop-color="#07101b"/>
<stop offset="38%" stop-color="#030810"/>
<stop offset="68%" stop-color="#01040a"/>
<stop offset="100%" stop-color="#000205"/>
</radialGradient>

<linearGradient id="mistBlue" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#061a2d" stop-opacity="0"/>
<stop offset="20%" stop-color="#0b5275" stop-opacity=".085"/>
<stop offset="42%" stop-color="#1685b2" stop-opacity=".18"/>
<stop offset="56%" stop-color="#2b9ed0" stop-opacity=".23"/>
<stop offset="76%" stop-color="#0b4f78" stop-opacity=".08"/>
<stop offset="100%" stop-color="#041a2e" stop-opacity="0"/>
</linearGradient>

<linearGradient id="mistCyan" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#031421" stop-opacity="0"/>
<stop offset="26%" stop-color="#0a5877" stop-opacity=".055"/>
<stop offset="50%" stop-color="#279bc5" stop-opacity=".145"/>
<stop offset="68%" stop-color="#176783" stop-opacity=".075"/>
<stop offset="100%" stop-color="#031421" stop-opacity="0"/>
</linearGradient>

<linearGradient id="mistPurple" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#13092a" stop-opacity="0"/>
<stop offset="30%" stop-color="#41226f" stop-opacity=".05"/>
<stop offset="52%" stop-color="#7446b4" stop-opacity=".11"/>
<stop offset="70%" stop-color="#351b5a" stop-opacity=".055"/>
<stop offset="100%" stop-color="#13092a" stop-opacity="0"/>
</linearGradient>

<radialGradient id="coreGlow">
<stop offset="0%" stop-color="#5798d0" stop-opacity=".08"/>
<stop offset="35%" stop-color="#315d93" stop-opacity=".035"/>
<stop offset="100%" stop-color="#000" stop-opacity="0"/>
</radialGradient>

<linearGradient id="verticalLight" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#6dc8ee" stop-opacity="0"/>
<stop offset="35%" stop-color="#73c9ea" stop-opacity=".035"/>
<stop offset="58%" stop-color="#b6e9ff" stop-opacity=".1"/>
<stop offset="78%" stop-color="#5bb7df" stop-opacity=".04"/>
<stop offset="100%" stop-color="#326b9a" stop-opacity="0"/>
</linearGradient>

<linearGradient id="nameGradient" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#fff">
<animate attributeName="stop-color" values="#fff;#d2c4ff;#8fe4ff;#fff" dur="6s" repeatCount="indefinite"/>
</stop>
<stop offset="28%" stop-color="#f7f4ff">
<animate attributeName="stop-color" values="#f7f4ff;#a997ff;#82dbff;#f7f4ff" dur="6s" repeatCount="indefinite"/>
</stop>
<stop offset="52%" stop-color="#c9bcff">
<animate attributeName="stop-color" values="#c9bcff;#7fe0ff;#e79ad8;#c9bcff" dur="6s" repeatCount="indefinite"/>
</stop>
<stop offset="72%" stop-color="#8edfff">
<animate attributeName="stop-color" values="#8edfff;#df9ed9;#a98dff;#8edfff" dur="6s" repeatCount="indefinite"/>
</stop>
<stop offset="100%" stop-color="#fff">
<animate attributeName="stop-color" values="#fff;#90e1ff;#c5baff;#fff" dur="6s" repeatCount="indefinite"/>
</stop>
<animate attributeName="x1" values="0%;-35%;0%" dur="6s" repeatCount="indefinite"/>
<animate attributeName="x2" values="100%;65%;100%" dur="6s" repeatCount="indefinite"/>
</linearGradient>

<linearGradient id="subGradient" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#63dcff">
<animate attributeName="stop-color" values="#63dcff;#9d8cff;#df78c4;#63dcff" dur="7s" repeatCount="indefinite"/>
</stop>
<stop offset="42%" stop-color="#a38cff">
<animate attributeName="stop-color" values="#a38cff;#df78c4;#63dcff;#a38cff" dur="7s" repeatCount="indefinite"/>
</stop>
<stop offset="72%" stop-color="#df78c4">
<animate attributeName="stop-color" values="#df78c4;#63dcff;#a38cff;#df78c4" dur="7s" repeatCount="indefinite"/>
</stop>
<stop offset="100%" stop-color="#63dcff">
<animate attributeName="stop-color" values="#63dcff;#df78c4;#9d8cff;#63dcff" dur="7s" repeatCount="indefinite"/>
</stop>
</linearGradient>

<linearGradient id="starTrail" x1="100%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#fff"/>
<stop offset="10%" stop-color="#f6fcff" stop-opacity=".92"/>
<stop offset="24%" stop-color="#d7efff" stop-opacity=".68"/>
<stop offset="42%" stop-color="#9cd5ee" stop-opacity=".38"/>
<stop offset="62%" stop-color="#6b9fc0" stop-opacity=".18"/>
<stop offset="82%" stop-color="#416a8a" stop-opacity=".055"/>
<stop offset="100%" stop-color="#203b54" stop-opacity="0"/>
</linearGradient>

<linearGradient id="cyanEdge" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#08778f"/>
<stop offset="50%" stop-color="#25c8e0"/>
<stop offset="100%" stop-color="#08778f"/>
</linearGradient>

<linearGradient id="purpleEdge" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#50419c"/>
<stop offset="50%" stop-color="#967fff"/>
<stop offset="100%" stop-color="#50419c"/>
</linearGradient>

<linearGradient id="greenEdge" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#14756d"/>
<stop offset="50%" stop-color="#31c5b5"/>
<stop offset="100%" stop-color="#14756d"/>
</linearGradient>

<filter id="mistBlur" x="-45%" y="-20%" width="190%" height="140%">
<feGaussianBlur stdDeviation="28"/>
</filter>

<filter id="verticalBlur" x="-60%" y="-20%" width="220%" height="140%">
<feGaussianBlur stdDeviation="12"/>
</filter>

<filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
<feGaussianBlur stdDeviation="10"/>
</filter>

<filter id="textGlow" x="-20%" y="-30%" width="140%" height="160%">
<feGaussianBlur stdDeviation="3" result="b"/>
<feMerge>
<feMergeNode in="b"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>

<filter id="starGlow" x="-100%" y="-100%" width="300%" height="300%">
<feGaussianBlur stdDeviation="2"/>
</filter>

<filter id="borderGlow" x="-30%" y="-30%" width="160%" height="160%">
<feGaussianBlur stdDeviation="1.5" result="b"/>
<feMerge>
<feMergeNode in="b"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>

<clipPath id="scene">
<rect width="900" height="980" rx="18"/>
</clipPath>
</defs>

<rect width="900" height="980" rx="18" fill="url(#bg)"/>

<g clip-path="url(#scene)">
<g filter="url(#mistBlur)" class="auroraPulse">

<path d="M-170 230 C30 90 170 95 330 180 C490 265 700 250 1080 80 L1080 185 C735 350 505 335 300 255 C120 185 20 200 -170 290 Z" fill="url(#mistBlue)">
<animateTransform attributeName="transform" type="translate" values="-90 20;-35 -15;60 15;105 -8;20 35;-90 20" dur="16s" repeatCount="indefinite"/>
<animateTransform attributeName="transform" type="scale" values="1;1.04;1.09;1.05;1" dur="16s" repeatCount="indefinite" additive="sum"/>
</path>

<path d="M-160 170 C55 310 185 305 355 195 C530 80 735 110 1080 270 L1080 365 C755 205 575 190 390 295 C205 400 45 360 -160 250 Z" fill="url(#mistCyan)">
<animateTransform attributeName="transform" type="translate" values="90 -20;35 25;-80 -12;-105 15;20 -30;90 -20" dur="19s" repeatCount="indefinite"/>
<animateTransform attributeName="transform" type="scale" values="1.02;1.07;1.10;1.04;1.02" dur="19s" repeatCount="indefinite" additive="sum"/>
</path>

<path d="M-180 620 C60 485 210 500 380 585 C560 675 750 635 1080 455 L1080 540 C760 720 555 720 345 625 C165 545 20 565 -180 675 Z" fill="url(#mistPurple)">
<animateTransform attributeName="transform" type="translate" values="-20 25;-80 -15;70 18;100 -20;-35 30;-20 25" dur="22s" repeatCount="indefinite"/>
<animateTransform attributeName="transform" type="scale" values="1;1.06;1.10;1.04;1" dur="22s" repeatCount="indefinite" additive="sum"/>
</path>

</g>

<g class="core" filter="url(#softGlow)">
<ellipse cx="450" cy="195" rx="260" ry="90" fill="url(#coreGlow)"/>
<ellipse cx="450" cy="540" rx="275" ry="80" fill="url(#coreGlow)"/>
</g>

